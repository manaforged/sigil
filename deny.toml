# cargo-deny configuration for sigil.
#
# Run as `cargo deny check` as part of the owned-host gate (see README).
# Schema reference: https://embarkstudios.github.io/cargo-deny/
# Tested against cargo-deny ~0.16 (April 2026).

# --- graph ------------------------------------------------------------------
# Target list we actually build for. Keeping this tight means cargo-deny
# doesn't complain about platform-specific crates that are never linked
# into any of our real builds.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false
# The checks govern what we SHIP. publish = false crates and examples
# are not shipping code, and their
# unique transitive deps are excluded recursively.
exclude-unpublished = true

[output]
feature-depth = 1

# --- advisories -------------------------------------------------------------
# Default posture: any RUSTSEC advisory fails the build. The `ignore` list is
# empty on purpose — every exception must land as a new entry here with a
# comment explaining (a) which advisory, (b) why we can't upgrade, (c) what
# the follow-up is.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # ttf-parser via ab_glyph -> sctk-adwaita -> winit (Linux window
    # decorations). winit's transitive tree; we render text with our own
    # skrifa/HarfRust stack and never touch ab_glyph at runtime.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via sctk-adwaita/winit; not our text path" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 in accesskit_unix; merged into zbus 6, no release of accesskit uses it yet; drop when accesskit_unix moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 in accesskit_unix; merged into zbus 6, no release of accesskit uses it yet; drop when accesskit_unix moves to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 in accesskit_unix; merged into zbus 6, no release of accesskit uses it yet; drop when accesskit_unix moves to zbus 6" },
    ]

# --- licenses ---------------------------------------------------------------
# Allow list is the SPDX intersection of what has been cleared for
# shipping. Sigil itself is MIT; third-party crates may still be Apache-2.0
# (or the other permissive licenses below). Anything not on this list fails
# the build and requires a conscious decision to add.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License — permissive, OSI-approved. Reached via
    # arboard's Windows backend (clipboard-win, error-code). Clear to ship.
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    # MPL-2.0 retained for any fluent-rs or future weak-copyleft deps.
    # Note: usvg 0.45+ relicensed to Apache-2.0 OR MIT, so the current deps
    # do not exercise this entry. It is kept as an explicit opt-in for
    # any future MPL-2.0 dep that passes legal review (unmodified
    # library use only; a downstream consumer's proprietary code is not contaminated by
    # MPL-2.0 linkage per MPL-2.0 §3.3).
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["OFL-1.1", "Bitstream-Vera"], crate = "sigil-fonts" },
]

[licenses.private]
ignore = true
registries = []

# --- bans -------------------------------------------------------------------
# Duplicate-version policy: we'd prefer one version of each crate, but the
# wgpu / winit / accesskit / tray-icon dependency trees bring in transitive
# duplicates we cannot dedupe ourselves. The `skip` list below captures the
# exact duplicates we know about (re-baselined against the published graph —
# `exclude-unpublished = true` — on 2026-08-19). When upstream consolidates,
# remove the entry — the rest of the check will catch any new unexpected
# duplicates.
[bans]
multiple-versions = "deny"
# Internal dev-dependencies of published crates are deliberately version-less
# path deps so `cargo publish` strips them (lockstep policy). Deny would
# block the gate on our own release policy, so keep this at warn: visibility
# is retained in the output, and external deps are unaffected because they
# all carry registry versions.
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Known-duplicated transitive crates. Each entry needs a pointer to the
# upstream cause so we can re-check periodically. Convention: skip every
# duplicated version EXCEPT the newest, so any additional new version still
# fails the gate.
skip = [
    { crate = "rustc-hash@1.1.0", reason = "naga 30 pins 1.1; dioxus-core 0.7 under the opt-in hot feature uses 2.x" },
    # wgpu 30 uses hashbrown 0.15 (via gpu-descriptor) AND 0.16 (via naga,
    # wgpu-core, wgpu-hal, gpu-allocator). All in the wgpu dep tree, no
    # workaround available.
    { crate = "hashbrown@0.16.1", reason = "wgpu 30 transitive (naga/wgpu-core)" },

    # foldhash follows hashbrown's version split for the same reason.

    # winit 0.30 pins windows-sys 0.52; criterion 0.5 (via is-terminal /
    # winapi-util / walkdir) pulls windows-sys 0.61. Both are dev/runtime
    # deps we cannot consolidate without forking.
    { crate = "windows-sys@0.52.0", reason = "winit 0.30 pins this version" },
    { crate = "windows-sys@0.61.2", reason = "criterion 0.5 transitive (is-terminal, walkdir)" },

    # usvg 0.48 requires tiny-skia-path 0.12.0; winit 0.30
    # pulls sctk-adwaita 0.10.1 which requires tiny-skia 0.11.4 (and thus
    # tiny-skia-path 0.11.4). Both are deep transitive deps we cannot unify
    # without forking sctk-adwaita or pinning usvg to an older version.
    # Re-check when sctk-adwaita is updated to tiny-skia 0.12+.
    { crate = "tiny-skia@0.11.4", reason = "sctk-adwaita 0.10.1 via winit 0.30; renderer uses 0.12.0" },
    { crate = "tiny-skia-path@0.11.4", reason = "sctk-adwaita 0.10.1 via winit 0.30 (usvg 0.48 needs 0.12.0)" },

    # --- winit / accesskit_winit chain -+
    # winit 0.30 and accesskit_macos 0.26.1 pin the objc2 0.5 / block2 0.5 /
    # core-graphics 0.23 generation; arboard, muda, rfd, tray-icon and
    # zed-font-kit have moved to the 0.6 / 0.24 generation. Cannot converge
    # until winit 0.31+ and a matching accesskit_winit land.
    { crate = "objc2@0.5.2",              reason = "accesskit_macos 0.26.1 / block2 0.5.1 (winit 0.30 chain); rest of tree on 0.6" },
    { crate = "objc2-app-kit@0.2.2",      reason = "accesskit_macos 0.26.1 and winit 0.30.13 pin; arboard/muda/rfd use 0.3.2" },
    { crate = "objc2-foundation@0.2.2",   reason = "accesskit_macos 0.26.1 / objc2-app-kit 0.2.2 pin; rest of tree on 0.3.2" },
    { crate = "block2@0.5.1",             reason = "objc2-foundation 0.2.2 (accesskit_macos/winit chain); rest of tree on 0.6.2" },
    { crate = "core-graphics@0.23.2",     reason = "winit 0.30 pins; core-text 21 (sigil-text/zed-font-kit) uses 0.24" },
    { crate = "core-graphics-types@0.1.3", reason = "follows core-graphics 0.23.2 (winit 0.30)" },
    { crate = "core-foundation@0.9.4",    reason = "follows core-graphics 0.23.2 (winit 0.30); 0.10 via core-graphics 0.24" },
    { crate = "bitflags@1.3.2",           reason = "core-graphics 0.23.2 / core-graphics-types 0.1.3 / png 0.17.16 pin v1" },
    { crate = "smol_str@0.2.2",           reason = "winit 0.30 pins; sigil-hal uses 0.3.6" },

    # --- Linux tray-icon stack (tray-icon -> libappindicator -> gtk3) ------
    # Same unmaintained GTK3 chain as the RUSTSEC-2024-04xx advisory ignores.
    # gtk3-macros/glib-macros pin an entire old proc-macro/toml ecosystem.
    { crate = "syn@2.0.119",              reason = "proc-macro ecosystem; bytemuck-derive has moved to syn 3" },
    { crate = "thiserror@1.0.69",         reason = "cairo-rs/glib/gio/calloop (tray + smithay chains); wgpu/naga use 2.0" },
    { crate = "thiserror-impl@1.0.69",    reason = "follows thiserror 1.0.69" },

    # phf converged 2026-08-19 (workspace req 0.13 — phf family + rand 0.8 /
    # rand_core 0.6 skips removed). skrifa converged the same day (req 0.42,
    # read-fonts skip removed).

    # --- misc upstream splits ----------------------------------------------
    { crate = "miniz_oxide@0.8.9",   reason = "png 0.18 via image 0.25; flate2 uses 0.9" },
    { crate = "rustix@0.38.44",      reason = "calloop 0.13 + crossterm 0.28.1 (winit/smithay chains); zbus/wayland on 1.x" },
    { crate = "linux-raw-sys@0.4.15", reason = "follows rustix 0.38.44" },
    { crate = "linux-raw-sys@0.9.4", reason = "drm-sys via softbuffer 0.4; rustix uses 0.12" },
    { crate = "getrandom@0.3.4",     reason = "ahash 0.8.12 + rand_core 0.9.5 pin; tempfile 3.27 uses 0.4.2" },
    { crate = "getrandom@0.2.17",    reason = "minisign 0.7.9 pin; tempfile uses 0.4" },

    # --- windows-* target crates -------------------------------------------
    # Target-specific support crates version-locked to their windows-sys
    # parent; the splits above (dirs-sys 0.4.1, rfd/rustix 0.38 on 0.59,
    # winit on 0.52) force multiple windows-sys generations, and these
    # follow mechanically. They cannot converge independently.
    { crate = "windows-sys@0.48.0",        reason = "dirs-sys 0.4.1 (dirs 5 / zed-font-kit)" },
    { crate = "windows-sys@0.59.0",        reason = "rfd 0.15.4 + rustix 0.38.44 pin; arboard/muda/notify on 0.60" },
    { crate = "windows-targets@0.48.5",    reason = "follows windows-sys 0.48.0" },
    { crate = "windows-targets@0.52.6",    reason = "follows windows-sys 0.52.0/0.59.0" },
    { crate = "windows_aarch64_msvc@0.48.5", reason = "follows windows-targets 0.48.5" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "follows windows-targets 0.52.6" },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "follows windows-targets 0.48.5" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "follows windows-targets 0.52.6" },
    { crate = "windows_x86_64_msvc@0.48.5", reason = "follows windows-targets 0.48.5" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "follows windows-targets 0.52.6" },

    # --- portable-pty 0.9 chain (sigil-app PTY hosting) ---------------------

    # --- cpal/rodio 0.15 chain (sigil-app audio playback) -------------------
    # rodio 0.20 -> cpal 0.15 pins the windows 0.54 generation; the rest of
    # the tree (winit/arboard/muda chains) is on 0.62. Converges when cpal
    # ships a release on windows 0.62+.
]
skip-tree = []

# --- sources ----------------------------------------------------------------
# Only crates.io is allowed as a package source. Any git dependency must be
# whitelisted explicitly in `allow-git` or via `sources.allow-org`.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
