    "crates/icons",
    "crates/layout",
    "crates/reactive",
    "crates/renderer",
    "crates/shell",
    "crates/style",
    "crates/style-macros",
    "crates/text",
    "crates/ide-core",
    "crates/bench-parity",
    "crates/bench-parity-gpui",
    "examples/hello-counter",
    "examples/hello-events",
    "examples/hello-style",
    "examples/hello-tree",
    "examples/hello-layout",
    "examples/internals/hello-rect",
    "examples/vertical-slice",
    "examples/timer-stopwatch",
    "examples/log-tailer",
    "examples/scratchpad",
    "examples/file-browser",
    "examples/kanban-board",
