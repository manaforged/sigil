[workspace]
resolver = "3"
members = ["crates/sigil", "crates/tui"]
default-members = ["crates/sigil", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/manaforged/sigil"
readme = "README.md"
authors = ["Thomas Gardiner"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
# NOTE: Cargo does NOT allow member crates to override workspace lints while
# `[lints] workspace = true` is set (the manifest fails to parse).
# Per-crate strictness therefore lives in crate-root
# attributes instead — library crates that contract on full rustdoc coverage
# use `#![deny(missing_docs)]` in their lib.rs. Binary / example crates only
# have bin targets, where missing_docs does not fire.
unreachable_pub = "warn"
# Dropped after the crate collapse: one package now has one dependency list,
# so every integration-test target would warn about every dep it does not use.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Doc comments are stripped pending the freeze-time docs rewrite.
missing_panics_doc = "allow"
missing_safety_doc = "allow"
# Rust hygiene restrictions for production code.
# Tests / benches / examples may bend `panic` or
# `indexing_slicing` via a crate-root #![allow] with a comment
# giving the reason.
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
mod_module_files = "deny"
# Conflicts with rustc `unreachable_pub` for `[[bin]]` crates that have
# internal sub-modules: clippy wants `pub(crate)`, rustc wants `pub`.
# Allow workspace-wide; library crates that genuinely want the lint can
# re-enable it per-crate.
redundant_pub_crate = "allow"
# Threshold lints — actual thresholds configured in clippy.toml.
# Clippy defaults (100 lines, 7 args, complexity 25) are too permissive
# for the clean-lean-Rust contract (50 lines, 5 args, complexity 15).
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "warn"
# Restriction lints — production-code hygiene.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
wildcard_imports = "warn"
shadow_unrelated = "warn"
# Pedantic upgrades — in pedantic="warn" by default, explicitly promoted to deny.
manual_async_fn = "deny"
redundant_clone = "deny"
# `clippy::cargo` is deliberately not enabled at the workspace level.
# Transitive multi-version dependencies come from wgpu and winit and are
# not under our control; treat at crate level if a specific crate can
# legitimately dedupe its own tree.

[workspace.dependencies]
winit = "0.30"
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"
softbuffer = "0.4"
tiny-skia = "0.12"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
skrifa = "0.46"
# CPU mask rasterizer for the hinted small-text path. Already in-graph
# transitively (cosmic-text -> swash -> zeno), zero-dep crate.
zeno = "0.3"
# Native desktop font discovery and CSS weight matching. This is Zed's
# cross-platform CoreText / DirectWrite / Fontconfig fork of font-kit.
zed-font-kit = "0.14.1-zed"
smallvec = "1"
rayon = "1.10"
phf = { version = "0.14", features = ["macros"] }
strsim = "0.11"
slotmap = "1"
ahash = "0.8"
tracing = "0.1"
accesskit = "0.25"
# The winit-side platform adapter half of the AccessKit bridge.
# `tokio` (not the default `async-io`) matches the zbus-panic workaround
# already assumed for the bare `accesskit` dep on
# Linux; sigil's own tokio runtime (`sigil-tasks`) already exists so this
# adds no new async-executor surface. `accesskit_unix` keeps the Linux
# AT-SPI2 backend available (it is opt-out only via `default-features`,
# there is no separate always-on gate). `winit/x11` + `winit/wayland`
# (accesskit_winit's own defaults) are NOT re-requested here — Cargo
# can't accept a transitive `dep/feature` string from a downstream
# manifest, only from the crate that owns the `[features]` table; our
# own direct `winit` dependency below already turns those backends on
# via default features, and Cargo's feature unification carries that
# into accesskit_winit's copy of the same `winit` crate. The pinned
# version matches the `accesskit` line above per accesskit_winit's own
# dependency manifest.
accesskit_winit = { version = "0.34", default-features = false, features = [
    "accesskit_unix",
    "tokio",
    "rwh_06",
] }
keyboard-types = { version = "0.8.3", default-features = false }
smol_str = { version = "0.3.6", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Workspace and file-watch primitives: `notify` is the
# de-facto cross-platform fs-watcher. `crossbeam-channel` carries fs
# events into consumer code.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel = "0.5"
# Settings: parse-only TOML (serde feature for typed deserialize).
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# System clipboard. `arboard` is the de-facto cross-platform
# Rust crate (Win32, X11, Wayland, AppKit). Default features include the
# image-encoding path we do not need, so depend with `default-features = false`
# to keep the transitive surface narrow.
arboard = { version = "3", default-features = false }
# The package publishes as `sigil-gui` (the bare `sigil` name was taken on
# crates.io) with the library still named `sigil`, so `use sigil::prelude::*`
# stays the single import user code needs.
sigil-gui = { path = "crates/sigil", version = "0.1.0" }
sigil-tui = { path = "crates/tui", version = "0.1.0" }
unicode-width = "0.2"
usvg = { version = "0.48", default-features = false }
lyon_geom = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profiling profile — same codegen as release but keeps debuginfo so
# samply / Firefox Profiler / VTune can resolve symbols. Use with:
#   cargo build --profile profiling --example profile_wide_tree
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
