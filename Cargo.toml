[workspace]
resolver = "3"
members = [
    "crates/sigil",
    "crates/sigil-fonts",
    "crates/sign",
    "crates/kittest",
]
exclude = ["fuzz"]
default-members = ["crates/sigil", "crates/sigil-fonts", "crates/sign"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/manaforged/sigil"
readme = "README.md"
authors = ["Thomas Gardiner"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
mod_module_files = "deny"
redundant_pub_crate = "allow"
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "warn"
todo = "deny"
ignore_without_reason = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
wildcard_imports = "warn"
shadow_unrelated = "warn"
manual_async_fn = "deny"
redundant_clone = "deny"

[workspace.dependencies]
serde_json = "1"
winit = "0.30"
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"
softbuffer = "0.4"
tiny-skia = "0.12"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
skrifa = "0.46"
# CPU mask rasterizer for the hinted small-text path. Already in-graph
# transitively (cosmic-text -> swash -> zeno), zero-dep crate.
zeno = "0.3"
# Native desktop font discovery and CSS weight matching. This is Zed's
# cross-platform CoreText / DirectWrite / Fontconfig fork of font-kit.
zed-font-kit = "0.14.1-zed"
smallvec = "1"
rayon = "1.10"
phf = { version = "0.14", features = ["macros"] }
strsim = "0.11"
slotmap = "1"
ahash = "0.8"
tracing = "0.1"
accesskit = "0.25"
# The winit-side platform adapter half of the AccessKit bridge.
# `tokio` (not the default `async-io`) matches the zbus-panic workaround
# already assumed for the bare `accesskit` dep on
# Linux; sigil's own tokio runtime (`sigil-tasks`) already exists so this
# adds no new async-executor surface. `accesskit_unix` keeps the Linux
# AT-SPI2 backend available (it is opt-out only via `default-features`,
# there is no separate always-on gate). `winit/x11` + `winit/wayland`
# (accesskit_winit's own defaults) are NOT re-requested here — Cargo
# can't accept a transitive `dep/feature` string from a downstream
# manifest, only from the crate that owns the `[features]` table; our
# own direct `winit` dependency below already turns those backends on
# via default features, and Cargo's feature unification carries that
# into accesskit_winit's copy of the same `winit` crate. The pinned
# version matches the `accesskit` line above per accesskit_winit's own
# dependency manifest.
accesskit_winit = { version = "0.34", default-features = false, features = [
    "accesskit_unix",
    "tokio",
    "rwh_06",
] }
keyboard-types = { version = "0.8.3", default-features = false }
smol_str = { version = "0.3.6", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Workspace and file-watch primitives: `notify` is the
# de-facto cross-platform fs-watcher. `crossbeam-channel` carries fs
# events into consumer code.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel = "0.5"
# Settings: parse-only TOML (serde feature for typed deserialize).
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# System clipboard. `arboard` is the de-facto cross-platform
# Rust crate (Win32, X11, Wayland, AppKit). Default features include the
# image-encoding path we do not need, so depend with `default-features = false`
# to keep the transitive surface narrow.
arboard = { version = "3", default-features = false }
sigil-ui = { path = "crates/sigil", version = "0.1.0" }
sigil-fonts = { path = "crates/sigil-fonts", version = "0.1.0" }
sigil-sign = { path = "crates/sign", version = "0.1.0" }
minisign = "0.7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
unicode-width = "0.2"
usvg = { version = "0.48", default-features = false }
lyon_geom = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profiling profile — same codegen as release but keeps debuginfo so
# samply / Firefox Profiler / VTune can resolve symbols. Use with:
#   cargo build --profile profiling --example profile_wide_tree
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
