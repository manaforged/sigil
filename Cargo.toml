[workspace]
resolver = "3"
members = [
    "crates/sigil-hal",
    "crates/sigil-reactive",
    "crates/sigil-core",
    "crates/sigil-layout",
    "crates/sigil-async",
    "crates/sigil-renderer",
    "crates/sigil-shell",
    "crates/sigil-events",
    "crates/sigil-style",
    "crates/sigil-style-macros",
    "crates/sigil-text",
    "crates/sigil-app",
    "crates/sigil",
    "examples/hello-rect",
    "examples/hello-events",
    "examples/hello-style",
    "examples/hello-tree",
    "examples/hello-layout",
    "examples/vertical-slice",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThomGardiner/sigil"
authors = ["the author"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# the author rust-hygiene restriction set. Agents loading the
# rust-hygiene skill treat these as non-negotiable in production
# code. Tests / benches / examples may bend `panic` or
# `indexing_slicing` via a crate-root #![allow] with a comment
# citing docs/plans/native-ui/hygiene-cleanup-framework.md.
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
mod_module_files = "deny"
# Threshold lints — actual thresholds configured in clippy.toml.
# Clippy defaults (100 lines, 7 args, complexity 25) are too permissive
# for the the author clean-lean-Rust contract (50 lines, 5 args, complexity 15).
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "warn"
# Restriction lints — production-code hygiene.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
wildcard_imports = "warn"
shadow_unrelated = "warn"
# Pedantic upgrades — in pedantic="warn" by default, explicitly promoted to deny.
manual_async_fn = "deny"
redundant_clone = "deny"
# `clippy::cargo` is deliberately not enabled at the workspace level.
# Transitive multi-version dependencies come from wgpu and winit and are
# not under our control; treat at crate level if a specific crate can
# legitimately dedupe its own tree.

[workspace.dependencies]
winit = "0.30"
wgpu = "29"
pollster = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
skrifa = "0.40"
smallvec = "1"
phf = "0.11"
strsim = "0.11"
slotmap = "1"
ahash = "0.8"
tracing = "0.1"
accesskit = "0.24"
keyboard-types = { version = "0.8.3", default-features = false }
smol_str = { version = "0.3.6", default-features = false }
taffy = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
sigil-hal = { path = "crates/sigil-hal" }
sigil-reactive = { path = "crates/sigil-reactive" }
sigil-core = { path = "crates/sigil-core" }
sigil-layout = { path = "crates/sigil-layout" }
sigil-async = { path = "crates/sigil-async" }
sigil-renderer = { path = "crates/sigil-renderer" }
sigil-shell = { path = "crates/sigil-shell" }
sigil-events = { path = "crates/sigil-events" }
sigil-style = { path = "crates/sigil-style" }
sigil-style-macros = { path = "crates/sigil-style-macros" }
sigil-text = { path = "crates/sigil-text" }
sigil-app = { path = "crates/sigil-app" }
sigil = { path = "crates/sigil" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
