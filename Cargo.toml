    "examples/csv-viewer",
    "examples/regex-tester",
    "examples/api-explorer",
    "examples/chat-client",
    "examples/widget-playground",
]
default-members = [
    "crates/sigil",
    "crates/a11y",
    "crates/actions",
    "crates/animation_runtime",
    "crates/actions_macros",
    "crates/animation",
    "crates/app",
    "crates/tasks",
