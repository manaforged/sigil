[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThomGardiner/sigil"
authors = ["the author"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
# `priority = -1` so per-crate `[lints.rust] missing_docs = "deny"` (used
# by library crates that contract on full rustdoc coverage) overrides
# this workspace default. Binary / example crates inherit the warn-level.
missing_docs = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# the author rust-hygiene restriction set. Agents loading the
# rust-hygiene skill treat these as non-negotiable in production
# code. Tests / benches / examples may bend `panic` or
# `indexing_slicing` via a crate-root #![allow] with a comment
# citing docs/plans/native-ui/hygiene-cleanup-framework.md.
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
mod_module_files = "deny"
# Conflicts with rustc `unreachable_pub` for `[[bin]]` crates that have
# internal sub-modules: clippy wants `pub(crate)`, rustc wants `pub`.
# Allow workspace-wide; library crates that genuinely want the lint can
# re-enable it per-crate.
redundant_pub_crate = "allow"
# Threshold lints — actual thresholds configured in clippy.toml.
# Clippy defaults (100 lines, 7 args, complexity 25) are too permissive
# for the the author clean-lean-Rust contract (50 lines, 5 args, complexity 15).
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "warn"
# Restriction lints — production-code hygiene.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
wildcard_imports = "warn"
shadow_unrelated = "warn"
# Pedantic upgrades — in pedantic="warn" by default, explicitly promoted to deny.
manual_async_fn = "deny"
redundant_clone = "deny"
# `clippy::cargo` is deliberately not enabled at the workspace level.
# Transitive multi-version dependencies come from wgpu and winit and are
# not under our control; treat at crate level if a specific crate can
# legitimately dedupe its own tree.

[workspace.dependencies]
winit = "0.30"
wgpu = "29"
pollster = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
skrifa = "0.40"
smallvec = "1"
rayon = "1.10"
phf = { version = "0.11", features = ["macros"] }
strsim = "0.11"
slotmap = "1"
ahash = "0.8"
tracing = "0.1"
accesskit = "0.24"
keyboard-types = { version = "0.8.3", default-features = false }
smol_str = { version = "0.3.6", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# I-T6 workspace + fs-watch primitives. Forever-rentals: `notify` is the
# de-facto cross-platform fs-watcher; `ignore` is BurntSushi's gitignore
# parser/walker; `crossbeam-channel` carries fs events into consumer code.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
ignore = "0.4"
crossbeam-channel = "0.5"
# I-T7 settings: parse-only TOML (serde feature for typed deserialize).
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tempfile = "3"
# F1 (dogfood-v2): system clipboard. `arboard` is the de-facto cross-platform
# Rust crate (Win32, X11, Wayland, AppKit). Default features include the
# image-encoding path we do not need, so depend with `default-features = false`
# to keep the transitive surface narrow.
arboard = { version = "3", default-features = false }
# Workspace leaf crates use bare names matching their directory (the host engine
# convention). The umbrella `sigil` crate re-exports everything as the
# public surface. `sigil-async` was renamed to `tasks` because `async`
# is a Rust reserved keyword and would force consumers to use `r#async`.
sigil = { path = "crates/sigil" }
a11y = { path = "crates/a11y" }
actions = { path = "crates/actions" }
actions-macros = { path = "crates/actions_macros" }
animation = { path = "crates/animation" }
animation-runtime = { path = "crates/animation_runtime" }
app = { path = "crates/app" }
tasks = { path = "crates/tasks" }
kernel = { path = "crates/kernel" }
events = { path = "crates/events" }
hal = { path = "crates/hal" }
layout = { path = "crates/layout" }
reactive = { path = "crates/reactive" }
renderer = { path = "crates/renderer" }
shell = { path = "crates/shell" }
style = { path = "crates/style" }
style-macros = { path = "crates/style-macros" }
icons = { path = "crates/icons" }
text = { path = "crates/text" }
ide-core = { path = "crates/ide-core" }
usvg = { version = "0.47", default-features = false }
lyon_geom = { version = "1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profiling profile — same codegen as release but keeps debuginfo so
# samply / Firefox Profiler / VTune can resolve symbols. Use with:
#   cargo build --profile profiling --example profile_wide_tree
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
