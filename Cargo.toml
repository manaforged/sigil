    "crates/events",
    "crates/hal",
    "crates/icons",
    "crates/layout",
    "crates/reactive",
    "crates/renderer",
    "crates/shell",
    "crates/style",
    "crates/style-macros",
    "crates/text",
    "crates/ide-core",
    "examples/hello-counter",
    "examples/hello-events",
    "examples/hello-style",
