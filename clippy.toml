# clippy.toml
# Configures thresholds for restriction lints to match the house
# clean-lean-Rust contract. Clippy defaults are too permissive:
#   too-many-lines:      100 → 50
#   too-many-arguments:    7 → 5
#   cognitive-complexity: 25 → 15
# Thresholds: 400-line files, 50-line functions, 5 args, CC 15.

too-many-lines-threshold = 50
too-many-arguments-threshold = 5
cognitive-complexity-threshold = 15
type-complexity-threshold = 200
