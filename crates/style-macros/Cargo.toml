[package]
name = "sigil-style-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proc macros for Sigil utility classes."
readme.workspace = true
keywords = ["styling", "macros", "gui"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "build.rs", "grammar/**"]

[lib]
proc-macro = true

[dependencies]
phf = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[build-dependencies]
phf_codegen = "0.13"
toml = "0.8"

[dev-dependencies]
sigil-style = { path = "../style" }
sigil-ui = { path = "../sigil" }
trybuild = "1"

[lints]
workspace = true
