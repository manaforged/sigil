[package]
name = "sigil-style-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proc macros for Sigil utility classes."

[lib]
proc-macro = true
doctest = false

[dependencies]
phf = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[build-dependencies]
phf_codegen = "0.11"
toml = "0.8"

[dev-dependencies]
sigil-style = { workspace = true }
trybuild = "1"

[lints]
workspace = true
