[package]
name = "sigil-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Owned layout adapter for Sigil."
readme.workspace = true
keywords = ["layout", "flexbox", "gui", "ui"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]

[dependencies]
ahash = { workspace = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
sigil-kernel = { workspace = true }
sigil-hal = { workspace = true }
sigil-style = { workspace = true }
sigil-reactive = { workspace = true }
sigil-profile = { workspace = true }

[dev-dependencies]
allocation-counter = "0.8.1"
criterion = { version = "0.5", features = ["html_reports"] }
# Threadpool primitive for the layout_ops benchmark only. Was a regular
# dependency for the (deleted) ParallelMeasure substrate; demoted to
# dev-only so it leaves the published dependency set.
rayon = { workspace = true }
taffy = "0.10"

[[bench]]
name = "layout_ops"
harness = false

[[bench]]
name = "invalidation_rig"
harness = false

[[bench]]
name = "taffy_corpus_huge_nested"
harness = false

[[bench]]
name = "taffy_corpus_wide_tree"
harness = false

[[bench]]
name = "taffy_corpus_incremental"
harness = false

[[bench]]
name = "taffy_corpus_deep"
harness = false

[[bench]]
name = "js_framework_benchmark"
harness = false

[lints]
workspace = true

[[bench]]
name = "resize_rig"
harness = false
