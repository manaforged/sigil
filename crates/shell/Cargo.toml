[package]
name = "shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "winit 0.30+ ApplicationHandler-backed Shell adapter."

[lib]
# Rust 1.94 merged-doctests + Windows-msvc target misdetection
# workaround. No runnable doctests are shipped.
doctest = false

[dependencies]
hal = { workspace = true }
smol_str = { workspace = true }
# NOTE: `sigil-async` is intentionally not a direct dependency in Phase 2.
# The wake bridge is exposed as an `Arc<dyn Fn() + Send + Sync>` so
# that `sigil-shell` does not pin the `sigil-async` public API before it
# stabilises. Add the dep (and replace the hook closure with a typed
# `sigil_async::AsyncRuntime` handle) when the `sigil-async` surface lands.
winit = { workspace = true }
# W5-A11Y (DR-050 §1) — the production `accesskit_winit::Adapter` wiring.
# `crossbeam-channel` bridges the adapter's `Send`-bound `ActionHandler`
# callback (may run on a platform AT-SPI/UIA/AX thread) back to the `!Send`
# UI thread; see `crates/shell/src/shell/a11y.rs`.
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
crossbeam-channel = { workspace = true }

[lints]
workspace = true
