[package]
name = "bench-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "GPUI 0.2.2 Ledger: the shared benchmark script replayed in a real GPUI window. Separate crate so the GPUI dependency tree stays out of the default build."

[lib]

[dependencies]
bench-spec = { path = "../bench-spec" }
data-table = { path = "../../examples/data-table", default-features = false }
gpui = "0.2.2"

[[bin]]
name = "ledger-gpui"
path = "src/bin/ledger-gpui.rs"

[lints]
workspace = true
