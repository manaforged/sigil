[package]
name = "bench-parity-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPUI framework runner for the bench-parity cross-framework harness. Kept in a sibling crate so the heavy GPUI dependency tree (blade-graphics, etc.) does NOT leak into the default bench-parity build."
publish = false

[lib]

[dependencies]
bench-parity = { path = "../bench-parity" }
# GPUI 0.2.2 on crates.io. `default-features = false` disables the
# platform/graphics features (font-kit, wayland, x11, windows-manifest)
# we don't need; `test-support` exports `TestAppContext` /
# `VisualTestContext` / `TestPlatform` — the only path that runs GPUI
# headlessly on Windows. See README.md for the spike that established
# this is the supported headless contract.
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
# GPUI's `TestDispatcher::new(StdRng)` requires rand 0.9 — same major
# version GPUI itself depends on, avoids the two-versions-in-graph trap.
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["formatting"] }

[[bin]]
name = "bench-parity-runner-gpui"
path = "src/bin/bench-parity-runner-gpui.rs"

[lints]
workspace = true
