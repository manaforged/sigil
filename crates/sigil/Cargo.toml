[package]
name = "sigil-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPU UI in Rust. One widget tree: launch, Host, or run_tui."
readme = "README.md"
keywords = ["gui", "ui", "widgets", "wgpu", "desktop"]
categories = ["gui"]
# Facade README is crate-local (crates/sigil/README.md) — it is also the
# docs.rs front page via `#![doc = include_str!("../README.md")]` in src/lib.rs.
# benches/** is intentionally absent: Cargo strips the four [[bench]] targets
# from the packaged manifest, and the benches are dev-only anyway.
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]
autobenches = false

[lib]
name = "sigil"

[dependencies]
sigil-actions = { workspace = true }
sigil-app = { workspace = true }
sigil-tui = { workspace = true, optional = true }
sigil-tasks = { workspace = true }
sigil-kernel = { workspace = true }
sigil-events = { workspace = true }
sigil-layout = { workspace = true }
sigil-reactive = { workspace = true }
sigil-style = { workspace = true }
sigil-profile = { workspace = true }
sigil-widgets = { workspace = true }
arboard = { workspace = true, optional = true }

# Optional GPU text + render surface for external host engines (e.g. a game engine).
# Off by default; enabled via the `render` feature. Pure-widget/desktop
# consumers (`sigil::launch`) are unaffected. See DR-054.
sigil-renderer = { workspace = true, optional = true }
sigil-text = { workspace = true, optional = true }
sigil-hal = { workspace = true, optional = true }

# Optional PNG decode for `image_bytes`. Off by default so the core lib
# carries no image-format decoders; the raw-RGBA `image_rgba` path needs
# nothing. The workspace `image` dep is already PNG-only + lean.
[features]
default = ["desktop"]
# winit + wgpu `launch`. Default so existing desktop binaries stay unchanged.
desktop = ["sigil-app/desktop", "clipboard"]
# Native services are opt-in so a basic window only builds the window host.
clipboard = ["dep:arboard"]
clipboard-image = ["clipboard", "arboard/image-data"]
dialog = ["desktop", "sigil-app/dialog"]
menu = ["desktop", "sigil-app/menu"]
tray = ["menu", "sigil-app/tray"]
# Terminal host. Does not enable wgpu. Combine with `default-features = false`
# for a TUI-only binary.
tui = ["dep:sigil-tui", "clipboard"]
# Exposes `sigil::{render, text}` and `Host::scene` without winit.
# See DR-054.
render = ["dep:sigil-renderer", "dep:sigil-text", "dep:sigil-hal", "sigil-app/scene"]
# Exposes `image_bytes(&[u8])` — decode an encoded image (PNG) to a
# widget. `image_rgba` (raw pixels) is always available without this.
image-decode = ["sigil-widgets/image-decode"]
# Exposes `dialog::mock` — inject canned file-dialog responses in your app's
# tests without opening a native picker. Enable in dev-dependencies.
test-support = ["dialog", "sigil-app/test-support"]
audio = ["sigil-app/audio"]
pty = ["sigil-app/pty"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
sigil-animation = { path = "../animation" }
sigil-animation-runtime = { path = "../animation_runtime" }
sigil-bidi = { path = "../bidi" }
sigil-hal = { path = "../hal" }
sigil-renderer = { path = "../renderer" }
image = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }

[[example]]
name = "profile_frame"
required-features = ["render"]

[[bench]]
name = "heatmap_perf"
harness = false

[[bench]]
name = "floating_text"
harness = false

[[bench]]
name = "virtual_list"
harness = false

[[bench]]
name = "widget_render"
harness = false

[lints]
workspace = true

[[bench]]
name = "table_ops"
harness = false

[[bench]]
name = "frame_phases"
harness = false

[package.metadata.docs.rs]
all-features = true
