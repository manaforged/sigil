[package]
name = "sigil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The sigil UI framework — one-stop facade crate with prelude."
autobenches = false

[lib]
doctest = false

[dependencies]
actions = { workspace = true }
animation-runtime = { workspace = true }
app = { workspace = true }
tasks = { workspace = true }
kernel = { workspace = true }
events = { workspace = true }
layout = { workspace = true }
reactive = { workspace = true }
style = { workspace = true }
arboard = { workspace = true }

# Optional GPU text + render surface for external host engines (e.g. a game engine).
# Off by default; enabled via the `render` feature. Pure-widget/desktop
# consumers (`sigil::launch`) are unaffected. See DR-054.
renderer = { workspace = true, optional = true }
text = { workspace = true, optional = true }
hal = { workspace = true, optional = true }

[features]
# Exposes `sigil::{render, text}` — the Slug text pipeline + scene
# compositing an embedding host drives. See DR-054.
render = ["dep:renderer", "dep:text", "dep:hal"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
animation = { workspace = true }
hal = { workspace = true }
renderer = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }

[[bench]]
name = "floating_text"
harness = false

[[bench]]
name = "virtual_list"
harness = false

[[bench]]
name = "widget_render"
harness = false

[lints]
workspace = true
