[package]
name = "sigil-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPU UI in Rust. One widget tree: launch and Host; the terminal host is sigil-tui."
readme = "README.md"
keywords = ["gui", "ui", "widgets", "wgpu", "desktop"]
categories = ["gui"]
include = ["src/**", "!src/**/*_tests.rs", "!src/**/tests.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "assets/**", "benches/**", "examples/**"]
autobenches = false

[lib]
name = "sigil"

[dependencies]
accesskit = { workspace = true }
ahash = { workspace = true }
crossbeam-channel = { workspace = true }
keyboard-types = { workspace = true }
notify = { workspace = true }
phf = { workspace = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
smol_str = { workspace = true }
strsim = { workspace = true }
tiny-skia = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
unicode-width = { workspace = true }

arboard = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true }
zeno = { workspace = true, optional = true }
half = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
image = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
lyon_geom = { workspace = true, optional = true }
harfrust = { version = "0.13", optional = true }
rfd = { version = "0.17", optional = true }
muda = { version = "0.19", optional = true }
tray-icon = { version = "0.24", optional = true }
rodio = { version = "0.22", optional = true }
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.62", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
zed-font-kit = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = { version = "21", optional = true }

[features]
default = ["desktop"]
desktop = ["scene", "shell", "clipboard"]
scene = [
    "cpu",
    "shaping-complex",
    "dep:wgpu",
    "dep:pollster",
    "dep:bytemuck",
    "dep:skrifa",
    "dep:zeno",
    "dep:half",
    "dep:image",
    "dep:usvg",
    "dep:lyon_geom",
    "dep:zed-font-kit",
    "dep:core-text",
    "dep:raw-window-handle",
]
shell = ["dep:winit", "dep:accesskit_winit"]
cpu = ["dep:softbuffer"]
shaping-complex = ["dep:harfrust"]
windowed = ["scene", "shell"]
capture = ["scene"]
bench = []
render = ["scene"]
clipboard = ["dep:arboard"]
clipboard-image = ["clipboard", "arboard/image-data"]
dialog = ["desktop", "dep:rfd"]
menu = ["desktop", "dep:muda", "dep:raw-window-handle"]
tray = ["menu", "dep:tray-icon"]
image-decode = ["dep:image"]
test-support = ["dialog"]
audio = ["dep:rodio"]
pty = ["dep:portable-pty", "dep:vt100"]

[dev-dependencies]
allocation-counter = "0.8.1"
criterion = { version = "0.8", features = ["html_reports"] }
image = { workspace = true }
pollster = { workspace = true }
proptest = { workspace = true }
rayon = { workspace = true }
taffy = "0.14"
wgpu = { workspace = true }

[[test]]
name = "text_integration"
path = "tests/text_integration.rs"

[[test]]
name = "shell_display_gate"
path = "tests/shell_display_gate.rs"
harness = false

[[example]]
name = "profile_frame"
required-features = ["render"]

[[example]]
name = "perf_100k_breakdown"
path = "examples/layout/perf_100k_breakdown.rs"

[[example]]
