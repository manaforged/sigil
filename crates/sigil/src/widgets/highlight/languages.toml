[styles]
comment = "on-surface-muted"
string = "success-11"
number = "warn-11"
keyword = "accent-11"
literal = "warn-11"
type = "info-11"
added = "success-11"
removed = "error-11"
meta = "info-11"

[lang.rust]
aliases = ["rs"]
line_comments = ["//"]
block_comment = ["/*", "*/"]
strings = ["\""]
numbers = true
words.keyword = [
    "as", "async", "await", "break", "const", "continue", "crate", "dyn", "else", "enum",
    "extern", "fn", "for", "if", "impl", "in", "let", "loop", "match", "mod", "move", "mut",
    "pub", "ref", "return", "self", "Self", "static", "struct", "super", "trait", "type",
    "unsafe", "use", "where", "while",
]
words.literal = ["true", "false", "None", "Some", "Ok", "Err"]
words.type = [
    "bool", "char", "str", "String", "Vec", "Option", "Result", "Box", "u8", "u16", "u32",
    "u64", "usize", "i8", "i16", "i32", "i64", "isize", "f32", "f64",
]

