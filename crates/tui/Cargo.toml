[package]
name = "sigil-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Terminal host for Sigil — same Host, widgets, and events as desktop."
readme = "README.md"
keywords = ["tui", "terminal", "ui"]
categories = ["command-line-interface", "gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]

[dependencies]
crossterm = "0.29"
sigil-animation-runtime = { workspace = true }
sigil-app = { workspace = true }
sigil-events = { workspace = true }
sigil-hal = { workspace = true }
sigil-kernel = { workspace = true }
sigil-reactive = { workspace = true }
sigil-style = { workspace = true }
sigil-tasks = { workspace = true }
sigil-widgets = { workspace = true }
smol_str = { workspace = true }
unicode-segmentation = "1.13.3"
unicode-width = { workspace = true }

[dev-dependencies]
image = { workspace = true }
sigil-layout = { workspace = true }
allocation-counter = "0.8.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
