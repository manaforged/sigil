[package]
name = "sigil-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Terminal host for Sigil — same Host, widgets, and events as desktop."
readme = "README.md"
keywords = ["tui", "terminal", "ui"]
categories = ["command-line-interface", "gui"]
include = ["src/**", "!src/**/*_tests.rs", "!src/**/tests.rs", "examples/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]
name = "sigil_tui"

[dependencies]
sigil-gui = { path = "../sigil", version = "0.1.0", default-features = false }
crossterm = "0.29"
smol_str = { workspace = true }
unicode-segmentation = "1.13.3"
unicode-width = { workspace = true }

[dev-dependencies]
image = { workspace = true }
allocation-counter = "0.8.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
