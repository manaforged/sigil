[package]
name = "sigil-ide-core"
autobenches = false
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IDE-grade primitives for sigil consumers: rope buffer, workspace model, fuzzy-search, settings, keymap. No dep on sigil widget library — consumable by non-sigil IDEs."

[lib]

[dependencies]
# Rope buffer: no external deps.
# Fuzzy search: owned algorithm; smallvec backs the inline-position
#   buffer on `Match` so short needles never allocate.
# Workspace and fs-watch: notify (fs events) + ignore (gitignore parser)
#   + crossbeam-channel + toml (config parsing).
# Settings: toml (parse-only). toml_edit deferred until a comment-
#   preserving round-trip is needed.
# Keymap: inherits from settings.
smallvec = { workspace = true }
notify = { workspace = true }
ignore = { workspace = true }
crossbeam-channel = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Reference rope for property tests; never a runtime dep (DR-040).
ropey = "1"
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "rope_perf"
harness = false

[[bench]]
name = "fuzzy_perf"
harness = false

[[bench]]
name = "workspace_perf"
harness = false

[lints]
workspace = true
