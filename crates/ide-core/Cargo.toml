[package]
name = "sigil-ide-core"
autobenches = false
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IDE-grade primitives for sigil consumers: rope buffer, workspace model, fuzzy-search, settings, keymap. No dep on sigil widget library — consumable by non-sigil IDEs."

[lib]

[dependencies]
# I-T2 rope buffer (W3.5): no external deps — own the rope.
# I-T5 fuzzy-search (W4.5): owned algorithm; smallvec backs the inline-position
#   buffer on `Match` so short needles never allocate.
# I-T6 workspace+fs-watch (W4.6): notify (fs events) + ignore (gitignore parser)
#   + crossbeam-channel + toml (config parsing).
# I-T7 settings (W5.4): toml (parse-only). toml_edit deferred until comment-
#   preserving round-trip is needed (post-I-T7-MVP).
# I-T8 keymap (W5.5): inherits from settings.
smallvec = { workspace = true }
notify = { workspace = true }
ignore = { workspace = true }
crossbeam-channel = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# I-T2 oracle for property tests — never a runtime dep (DR-040 own-what-we-replace).
ropey = "1"
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "rope_perf"
harness = false

[[bench]]
name = "fuzzy_perf"
harness = false

[[bench]]
name = "workspace_perf"
harness = false

[lints]
workspace = true
