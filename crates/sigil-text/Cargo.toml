parley = "0.8"
ahash = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sigil-core = { workspace = true }
sigil-layout = { workspace = true }
taffy = { workspace = true }

[lints]
workspace = true
