[package]
name = "sigil-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless event routing, hit-testing, focus, and builder handlers for Sigil."
readme.workspace = true
keywords = ["events", "input", "gui", "keyboard"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]

[dependencies]
accesskit = { workspace = true }
sigil-kernel = { workspace = true }
sigil-hal = { workspace = true }
sigil-layout = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
allocation-counter = "0.8.1"
criterion = { version = "0.8", features = ["html_reports"] }
sigil-reactive = { path = "../reactive" }
sigil-style = { path = "../style" }

[[bench]]
name = "events_ops"
harness = false

[lints]
workspace = true
