[package]
name = "sigil-kittest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless test harness for Sigil: drive widgets through EventRouter and render them to PNG goldens offscreen."
readme = "README.md"
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]
keywords = ["gui", "testing", "golden", "sigil"]
categories = ["development-tools::testing"]

[lib]
name = "sigil_kittest"

[dependencies]
sigil-ui = { path = "../sigil", version = "0.1.0", default-features = false, features = [
    "scene",
    "kittest",
    "terminal",
    "test-clock",
] }
accesskit = { workspace = true }
image = { workspace = true }
wgpu = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "frame_scenarios"
harness = false
