[package]
name = "sigil-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Node arena, component composition, semantics, and builder ergonomics for Sigil."
readme.workspace = true
keywords = ["gui", "tree", "semantics", "widgets"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]
# Keep the Windows-msvc merged-doctests workaround consistent with
# the foundation crates. Public examples are exercised by integration
# tests and examples instead.

[dependencies]
accesskit = { workspace = true }
ahash = { workspace = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
sigil-hal = { workspace = true }
sigil-reactive = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "tree_ops"
harness = false

[lints]
workspace = true
