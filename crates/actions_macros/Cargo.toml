[package]
name = "sigil-actions-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proc macros for Sigil typed actions (#[derive(Action)])."
readme.workspace = true
keywords = ["actions", "macros", "gui"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
sigil-actions = { path = "../actions" }
sigil-ui = { path = "../sigil" }

[lints]
workspace = true
