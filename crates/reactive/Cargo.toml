[package]
name = "sigil-reactive"
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Leptos 0.5+ style reactive core — signals, effects, derived, owner tree."

[lib]
# Rust 1.94 merged-doctests + Windows-msvc target misdetection
# workaround. Crate-level examples are marked `rust,ignore`; the
# same examples live in `tests/reactive_contract.rs` as real tests.
doctest = false

[dependencies]
sigil-actions = { workspace = true }
smallvec = { workspace = true }
# G5 (DR-048): Task<T> wraps oneshot for completion routing and stores
# AbortHandle for RAII cancel. Sync feature pulls in `oneshot`; the
# `task` module is implicit in the crate root and provides AbortHandle.
# We do NOT enable `rt`/`rt-multi-thread` here — the executor itself is
# owned by sigil-async and installed via the TaskExecutor trait.
tokio = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "reactive_ops"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "realtime"
harness = false

[[bench]]
name = "memory"
harness = false

[lints]
workspace = true
