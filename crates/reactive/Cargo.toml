[package]
name = "sigil-reactive"
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Leptos 0.5+ style reactive core — signals, effects, derived, owner tree."
readme = "README.md"
keywords = ["signals", "reactivity", "gui", "state-management"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]
# Rust 1.94 merged-doctests + Windows-msvc target misdetection
# workaround. Crate-level examples are marked `rust,ignore`; the
# same examples live in `tests/reactive_contract.rs` as real tests.

[dependencies]
sigil-actions = { workspace = true }
smallvec = { workspace = true }
# DR-048: Task<T> wraps oneshot for completion routing and stores
# AbortHandle for RAII cancel. Sync feature pulls in `oneshot`; the
# `task` module is implicit in the crate root and provides AbortHandle.
# Base sync features only. The `rt` family is enabled per-target in the
# target tables below — `rt-multi-thread` on native (the tasks executor
# owns a multi-thread tokio runtime), bare `rt` on wasm.
tokio = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
sigil-ui = { path = "../sigil" }

[[bench]]
name = "reactive_ops"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "realtime"
harness = false

[[bench]]
name = "memory"
harness = false

[lints]
workspace = true
