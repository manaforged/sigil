[package]
name = "sigil-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Owned text engine for Sigil (skrifa + unicode-segmentation)."

[lib]
# Rust 1.94 merged-doctests + Windows-msvc target misdetection
# workaround. No runnable doctests are shipped.
doctest = false

[features]
shaping-complex = ["dep:harfrust"]

[dependencies]
sigil-hal = { workspace = true }
sigil-reactive = { workspace = true }
sigil-style = { workspace = true }
skrifa = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
unicode-script = "0.5"
unicode-segmentation = "1"
unicode-bidi = "0.3"
ahash = { workspace = true }
harfrust = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sigil-kernel = { workspace = true }
sigil-layout = { workspace = true }

[lints]
workspace = true
