[package]
name = "text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Owned text engine for Sigil (skrifa + unicode-segmentation)."

[lib]
# Rust 1.94 merged-doctests + Windows-msvc target misdetection
# workaround. No runnable doctests are shipped.
doctest = false

[features]
default = ["shaping-complex"]
# HarfRust-backed shaping (kerning, ligatures, marks) for every
# script — default-on since Wave 4. Disable with
# `default-features = false` to fall back to the naive skrifa-only
# path (no kerning/ligatures); a `shaping-minimal` feature name is
# reserved if that path needs promoting to its own opt-in surface.
shaping-complex = ["dep:harfrust"]

[dependencies]
hal = { workspace = true }
reactive = { workspace = true }
style = { workspace = true }
skrifa = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
unicode-script = "0.5"
unicode-segmentation = "1"
unicode-bidi = "0.3"
ahash = { workspace = true }
harfrust = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
kernel = { workspace = true }
layout = { workspace = true }

[lints]
workspace = true
