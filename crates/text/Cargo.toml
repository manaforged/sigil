[package]
name = "sigil-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Owned text engine for Sigil (skrifa + unicode-segmentation)."
readme.workspace = true
keywords = ["text", "shaping", "fonts", "typography", "gui"]
categories = ["gui", "text-processing"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "assets/**"]

[lib]

[features]
default = ["shaping-complex"]
# HarfRust-backed shaping (kerning, ligatures, marks) for every
# script — default-on since Wave 4. Disable with
# `default-features = false` to fall back to the naive skrifa-only
# path (no kerning/ligatures); a `shaping-minimal` feature name is
# reserved if that path needs promoting to its own opt-in surface.
shaping-complex = ["dep:harfrust"]

[dependencies]
sigil-hal = { workspace = true }
sigil-reactive = { workspace = true }
sigil-style = { workspace = true }
skrifa = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
unicode-bidi = "0.3"
ahash = { workspace = true }
harfrust = { version = "0.6", optional = true }
image = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sigil-kernel = { path = "../kernel" }
sigil-layout = { path = "../layout" }

[lints]
workspace = true
