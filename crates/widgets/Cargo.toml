[package]
name = "sigil-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "First-party Sigil widgets — host-agnostic builders (no window, no GPU)."
readme = "README.md"
keywords = ["gui", "widgets", "ui"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]

[dependencies]
sigil-animation-runtime = { workspace = true }
sigil-bidi = { workspace = true }
sigil-events = { workspace = true }
sigil-kernel = { workspace = true }
sigil-layout = { workspace = true }
sigil-reactive = { workspace = true }
sigil-style = { workspace = true }
sigil-profile = { workspace = true }
tracing = { workspace = true }
tiny-skia = "0.12"
image = { workspace = true, optional = true }

[features]
image-decode = ["dep:image"]

[dev-dependencies]
sigil-hal = { workspace = true }
# Doctests are user-facing docs written against the facade's consumer path
# (`sigil::prelude::*`). Dev-dep cycles back to sigil-ui are allowed by cargo.
# No default features: the examples use no host, so skip the winit build.
sigil-ui = { path = "../sigil", default-features = false }

[lints]
workspace = true
