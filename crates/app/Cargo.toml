[package]
name = "sigil-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sigil application shell — sigil::launch, opinionated frame loop."
readme.workspace = true
keywords = ["gui", "framework", "app"]
categories = ["gui"]
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]

[features]
default = ["desktop"]
# Slug text + command scene. No window. `Host::scene` lives here.
scene = ["dep:sigil-renderer", "dep:sigil-text"]
# winit + wgpu launch, native dialogs/menu/tray, Slug text.
desktop = [
    "scene",
    "dep:sigil-shell",
    "dep:rfd",
    "dep:muda",
    "dep:tray-icon",
    "dep:raw-window-handle",
]
# Test seam: exposes `dialog::mock` so downstream apps can inject canned
# file-dialog responses in their own tests without opening a native picker.
# Sigil's own tests see the mock via `cfg(test)` without enabling this.
test-support = []
# Decode and play files through rodio.
audio = ["dep:rodio"]
# Spawn a host PTY and stream rows into `Session.lines`.
pty = ["dep:portable-pty", "dep:vt100"]

[dependencies]
sigil-tasks = { workspace = true }
sigil-animation-runtime = { workspace = true }
sigil-kernel = { workspace = true }
sigil-events = { workspace = true }
sigil-hal = { workspace = true }
sigil-layout = { workspace = true }
sigil-reactive = { workspace = true }
sigil-renderer = { workspace = true, optional = true }
sigil-shell = { workspace = true, optional = true }
sigil-style = { workspace = true }
sigil-text = { workspace = true, optional = true }
sigil-profile = { workspace = true }
tracing = { workspace = true }
# W5-A11Y (DR-050 §1) — production AccessKit wiring in the frame loop.
sigil-a11y = { workspace = true }
accesskit = { workspace = true }
crossbeam-channel = { workspace = true }
# T14 (5/5 Wave 4) — dev-mode theme-file watch: parse theme TOML and
# reload on fs change events.
notify = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
# Native file dialogs (open / save / folder) and message alerts.
# Uses the OS-native picker on macOS + Windows; Linux uses GTK3.
rfd = { version = "0.15", optional = true }
# Native menu bar (muda) + system tray (tray-icon). Native on macOS/Windows.
muda = { version = "0.17", optional = true }
tray-icon = { version = "0.21", optional = true }
# Extract the Win32 hwnd for muda's init_for_hwnd. The enum carries all
# variants on every OS, so the match compile-checks cross-platform.
raw-window-handle = { version = "0.6", optional = true }
rodio = { version = "0.20", optional = true }
portable-pty = { version = "0.8", optional = true }
vt100 = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
# wgpu-hal 29.0.1 GLES/WGL backend needs windows-core's `std` feature
# to provide `impl std::error::Error for windows_core::Error`.
windows-core = { version = "0.62", default-features = false, features = ["std"] }

[dev-dependencies]
# Doctests are user-facing docs written against the facade's consumer path
# (`sigil::menu` / `sigil::dialog` / `sigil::tray`). Dev-dep cycles back to
# sigil-ui are allowed by cargo. Default features stay on: the examples
# need the facade's desktop-gated re-exports.
sigil-ui = { path = "../sigil" }

[lints]
workspace = true
