[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sigil application shell — sigil::launch, opinionated frame loop."

[lib]
doctest = false

[dependencies]
tasks = { workspace = true }
kernel = { workspace = true }
events = { workspace = true }
hal = { workspace = true }
layout = { workspace = true }
reactive = { workspace = true }
renderer = { workspace = true }
shell = { workspace = true }
style = { workspace = true }
text = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# wgpu-hal 29.0.1 GLES/WGL backend needs windows-core's `std` feature
# to provide `impl std::error::Error for windows_core::Error`.
windows-core = { version = "0.62", default-features = false, features = ["std"] }

[lints]
workspace = true
