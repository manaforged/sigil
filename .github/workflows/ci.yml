name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: workflow lint
        run: |
          docker build --tag ci-actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ci-actionlint

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: list
        run: echo "jobs=$(scripts/gate.sh --list)" >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    name: gate (${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-
      - name: linux system libs and software Vulkan adapter
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev mesa-vulkan-drivers
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          sudo chown -R "$USER" ~/apt-archives
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: gate-${{ matrix.job }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-hack,cargo-deny@0.20.2,cargo-fuzz@0.13.2,mdbook@0.4.40,wasm-bindgen-cli@0.2.127
      - name: gate
        run: scripts/gate.sh --gpu ${{ matrix.job }}

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: cargo test --workspace --locked --features sigil-ui/terminal
      - name: display gate
        env:
          SIGIL_DISPLAY_GATE: "1"
        run: cargo test -p sigil-ui --locked --test shell_display_gate

  required:
    if: always()
    needs: [workflows, plan, gate, platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a gate job ended with $result" >&2
              exit 1
            fi
          done
