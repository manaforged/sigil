name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: workflow lint
        run: |
          docker build --tag ci-actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ci-actionlint

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_TEST_THREADS: "1"
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: linux system libs and software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev mesa-vulkan-drivers
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: "false"
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-hack,cargo-deny@0.20.2,cargo-fuzz@0.13.2,mdbook@0.4.40,wasm-bindgen-cli@0.2.127
      - name: truesight
        run: cargo install --locked --git https://github.com/manaforged/truesight --rev cc48651ea3b5db2b1f71fffc828ab7e222f0e6e8 cargo-truesight
      - name: gate
        run: scripts/gate.sh --gpu

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: "false"
      - name: test
        run: cargo test --workspace --locked --features sigil-ui/terminal
      - name: display gate
        env:
          SIGIL_DISPLAY_GATE: "1"
        run: cargo test -p sigil-ui --locked --test shell_display_gate

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: linux system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - name: minimum Rust
        run: |
          rust=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$rust" = "1.90"
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 check -p sigil-ui --all-features --locked

  required:
    if: always()
    needs: [workflows, gate, platforms, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a gate job ended with $result" >&2
              exit 1
            fi
          done
