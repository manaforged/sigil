# Sigil CI
#
# Runs on release tags and manual dispatch only. Tests run on the
# author's machine before a push; the pre-push hook runs the same
# check. A runner exists to prove a release from a clean Linux
# checkout. Concurrency cancels superseded runs on the same ref.
#
# The GPU and main-thread tier (the ignored tests) still runs on
# owned native builders before a release; hosted runners have no
# adapters and renderer tests are ignored by default.

name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info dwarfs hosted-runner disks (local deps dir alone: 48 GB).
  # Backtraces in CI crashes lose line numbers; local builds keep them.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      docs: ${{ steps.filter.outputs.docs }}
      files: ${{ steps.filter.outputs.files }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: list changed paths
        id: filter
        run: |
          changed=$(git ls-files)
          is_rust=$(grep -qE '^(crates/|examples/|Cargo\.(toml|lock)|clippy\.toml|deny\.toml|rust-toolchain\.toml|\.github/workflows/ci\.yml)' <<<"$changed" && echo true || echo false)
          is_site=$(grep -qE '^(site/|scripts/check-site-catalog\.mjs)' <<<"$changed" && echo true || echo false)
          is_docs=$(grep -qE '^docs/' <<<"$changed" && echo true || echo false)
          {
            echo "rust=$is_rust"
            echo "site=$is_site"
            echo "docs=$is_docs"
            echo "files<<DELIM_CHANGED" >> "$GITHUB_OUTPUT"
            echo "$changed" >> "$GITHUB_OUTPUT"
            echo "DELIM_CHANGED" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: free runner disk (preinstalled SDKs are dead weight here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/boost /usr/local/share/powershell
          df -h / | tail -1
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny

      - name: fmt
        run: cargo fmt --check
      - name: inline tests
        run: python3 scripts/check-inline-tests.py
      - name: file caps
        run: python3 scripts/check-file-caps.py
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: deny
        run: cargo deny check

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: free runner disk (preinstalled SDKs are dead weight here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/boost /usr/local/share/powershell
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - name: compute affected packages (changed + reverse-dep closure)
        id: affected
        env:
          FILES: ${{ needs.changes.outputs.files }}
        run: |
          cargo metadata --format-version 1 > /tmp/meta.json
          python3 - <<'PY'
          import json, os

          meta = json.load(open("/tmp/meta.json"))
          changed = [f for f in os.environ["FILES"].splitlines() if f.strip()]

          member_by_dir = {}
          cwd = os.getcwd() + "/"
          for p in meta["packages"]:
              directory = os.path.dirname(p["manifest_path"])
              if directory.startswith(cwd):
                  member_by_dir[directory[len(cwd) :]] = p["name"]

          changed_members = set()
          for f in changed:
              for directory, name in member_by_dir.items():
                  if f == directory or f.startswith(directory + "/"):
                      changed_members.add(name)

          rev = {name: set() for name in member_by_dir.values()}
          for p in meta["packages"]:
              for dep in p.get("dependencies", []):
                  if dep.get("path") and dep["name"] in rev and p["name"] in rev:
                      rev[dep["name"]].add(p["name"])

          affected, frontier = set(), sorted(changed_members)
          while frontier:
              current = frontier.pop()
              if current in affected:
                  continue
              affected.add(current)
              frontier.extend(rev.get(current, ()))

          flags = "".join(f" -p {name}" for name in sorted(affected))
          if not flags:
              print("no member matched; falling back to the full workspace")
              flags = "--workspace"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"flags={flags}\n")
          print("flags=" + flags)
          PY
      - name: test
        run: cargo test --no-fail-fast ${{ steps.affected.outputs.flags }}

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.90.0
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - name: check (MSRV, locked, all features)
        run: cargo check --workspace --all-targets --locked --all-features

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: catalog matches committed captures
        run: node scripts/check-site-catalog.mjs

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: peaceiris/actions-mdbook@062dc9e3eab0bad35531417c6bb6c6a7a184764f # v2
        with:
          mdbook-version: "0.4.40"
      - name: book builds
        run: mdbook build docs/book
