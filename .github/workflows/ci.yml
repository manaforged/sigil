name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  gate:
    if: github.repository == 'manaforged/sigil' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    name: gate (${{ matrix.job }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: lint
            tools: cargo-deny@0.20.2,mdbook@0.4.40
          - job: features
            tools: cargo-hack
          - job: wasm
            tools: wasm-bindgen-cli@0.2.127
          - job: test
            tools: ""
          - job: perf
            tools: ""
          - job: msrv
            tools: ""
          - job: fuzz
            tools: cargo-fuzz@0.13.2
          - job: publish
            tools: ""
    env:
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: linux system libs
        if: matrix.job != 'wasm' && matrix.job != 'publish'
        env:
          JOB: ${{ matrix.job }}
        run: |
          pkgs=(libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev)
          if [ "$JOB" = test ]; then
            pkgs+=(mesa-vulkan-drivers)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          if [ "$JOB" = test ]; then
            driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
            test -n "$driver"
            echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          fi
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        if: matrix.job != 'publish'
        with:
          shared-key: gate-${{ matrix.job }}
          workspaces: ${{ matrix.job == 'fuzz' && 'fuzz -> target' || '. -> target' }}
          save-if: false
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        if: matrix.tools != ''
        with:
          tool: ${{ matrix.tools }}
      - name: gate
        run: scripts/gate.sh ${{ matrix.job == 'test' && '--gpu' || '' }} ${{ matrix.job }}

  platforms:
    if: github.repository == 'manaforged/sigil' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: false
      - name: test
        run: |
          cargo test --workspace --locked --features sigil-ui/terminal --lib --bins --tests
          cargo test --workspace --locked --features sigil-ui/terminal --doc
      - name: display gate
        env:
          SIGIL_DISPLAY_GATE: "1"
        run: cargo test -p sigil-ui --features kittest --locked --test shell_display_gate
