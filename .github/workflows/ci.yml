# Sigil CI
#
# Runs on pushes to main, pull requests targeting main, release tags,
# and manual dispatch. Every job runs on a release tag so a release is
# proven from a clean Linux checkout. Concurrency cancels superseded
# runs on the same ref.
#
# The GPU and main-thread tier (the ignored tests) still runs on
# owned native builders before a release; hosted runners have no
# adapters and renderer tests are ignored by default.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info dwarfs hosted-runner disks (local deps dir alone: 48 GB).
  # Backtraces in CI crashes lose line numbers; local builds keep them.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: free runner disk (preinstalled SDKs are dead weight here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/boost /usr/local/share/powershell
          df -h / | tail -1
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny

      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: deny
        run: cargo deny check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: free runner disk (preinstalled SDKs are dead weight here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/boost /usr/local/share/powershell
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - name: test
        run: cargo test --workspace --no-fail-fast --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.90.0
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - name: check (MSRV, locked, all features)
        run: cargo check --workspace --all-targets --locked --all-features

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: peaceiris/actions-mdbook@062dc9e3eab0bad35531417c6bb6c6a7a184764f # v2
        with:
          mdbook-version: "0.4.40"
      - name: book builds
        run: mdbook build docs/book
