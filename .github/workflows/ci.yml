name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: workflow lint
        run: |
          docker build --tag ci-actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ci-actionlint
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: fmt
        run: cargo fmt --check
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny@0.20.2

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: deny
        run: cargo deny check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGIL_REQUIRE_GOLDENS: "1"
      RUST_TEST_THREADS: "1"
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: software Vulkan adapter
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: build tests
        run: cargo test --workspace --lib --tests --no-run --locked --timings
      - name: test
        run: cargo test --workspace --lib --tests --no-fail-fast --locked
      - name: GPU device ownership, draw order, and uploads
        run: cargo test -p sigil-gui --test renderer_record_screen --test renderer_tall_scene --test renderer_frame_upload --locked -- --ignored
      - name: doctests
        run: cargo test --workspace --doc --no-fail-fast --locked
      - name: build size
        if: ${{ !cancelled() }}
        run: |
          df -h .
          du -sh target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: linux system libs (tray GTK3 stack, udev, alsa, xkbcommon, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.90.0
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: check (MSRV, locked, all features)
        run: cargo check --workspace --all-targets --locked --all-features

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: peaceiris/actions-mdbook@062dc9e3eab0bad35531417c6bb6c6a7a184764f # v2
        with:
          mdbook-version: "0.4.40"
      - name: book builds
        run: mdbook build docs/book
