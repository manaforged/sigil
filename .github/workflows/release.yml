name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: tag matches the workspace version and a dated changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi
          heading=$(grep -m 1 -E "^## \[?${version//./\\.}\]?( |$)" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          case $heading in
            *Unreleased*)
              echo "CHANGELOG.md still marks $version as Unreleased" >&2
              exit 1
              ;;
          esac

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: linux system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libudev-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; split($2, h, /[ \t]/); if (h[1] == v || h[1] == "[" v "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
