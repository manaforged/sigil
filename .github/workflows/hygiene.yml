name: hygiene

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  hygiene:
    if: github.repository == 'manaforged/sigil'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository content and change metadata
        env:
          HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          patterns="$RUNNER_TEMP/hygiene.patterns"
          printf '%s\n' "$HYGIENE_PATTERNS" | sed '/^$/d' > "$patterns"
          if [ ! -s "$patterns" ]; then
            echo '::error::Configure the HYGIENE_PATTERNS repository secret.'
            exit 1
          fi
          target=HEAD
          if [ -n "$PR_NUMBER" ]; then
            git fetch --no-tags --no-recurse-submodules origin "+refs/pull/$PR_NUMBER/head"
            target=FETCH_HEAD
          fi
          failed=0
          scan() {
            local status=0
            grep -qiEf "$patterns" "$1" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$2 contains denied text"
              failed=1
            elif [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          }
          banned_paths='(^|/)\.DS_Store$|\.bak([.-].*)?$|\.(orig|rej|swp|swo)$|~$|(^|/)\.env(\..+)?$'
          allowed_env='(^|/)\.env\.(example|sample|template)$'
          git ls-tree -r --name-only "$target" > "$RUNNER_TEMP/hygiene-paths"
          if grep -iE "$banned_paths" "$RUNNER_TEMP/hygiene-paths" | grep -ivE "$allowed_env" > "$RUNNER_TEMP/hygiene-bad-paths"; then
            while IFS= read -r path; do
              echo "::error::Tracked path $path is an ignored editor, backup, or environment file"
            done < "$RUNNER_TEMP/hygiene-bad-paths"
            failed=1
          fi
          blob_status=0
          git grep -q -a -iEf "$patterns" "$target" -- || blob_status=$?
          if [ "$blob_status" -eq 0 ]; then
            echo "::error::Repository content contains denied text"
            failed=1
          elif [ "$blob_status" -ne 1 ]; then
            exit "$blob_status"
          fi
          if [ -n "$BASE" ] && [[ ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$target"
          elif previous=$(git describe --tags --abbrev=0 --match 'v*' "$target^" 2>/dev/null); then
            range="$previous..$target"
          else
            range="$target"
          fi
          git log --format=%B "$range" > "$RUNNER_TEMP/hygiene-messages"
          scan "$RUNNER_TEMP/hygiene-messages" "Commit messages"
          jq -r '.pull_request.title // "", .pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/hygiene-pr"
          scan "$RUNNER_TEMP/hygiene-pr" "Pull request metadata"
          exit "$failed"
