[package]
name = "sigil-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sigil = { package = "sigil-ui", path = "../crates/sigil", default-features = false, features = ["scene", "terminal"] }
sigil-kittest = { path = "../crates/kittest" }

[workspace]

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg_icon"
path = "fuzz_targets/svg_icon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mermaid"
path = "fuzz_targets/mermaid.rs"
test = false
doc = false
bench = false

[[bin]]
name = "style_class"
path = "fuzz_targets/style_class.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scene_render"
path = "fuzz_targets/scene_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe_reply"
path = "fuzz_targets/probe_reply.rs"
test = false
