[package]
name = "ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Benchmark project: 10k x 24 grid with sort, filter, selection, inline edit, undo, and a live tick stream."

[lib]
name = "ledger"
path = "src/lib.rs"

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
bench-spec = { path = "../../crates/bench-spec" }
data-table = { path = "../data-table", default-features = false }
sigil-ui = { workspace = true }

[dev-dependencies]
sigil-hal = { workspace = true }
sigil-layout = { workspace = true }
sigil-profile = { workspace = true }
sigil-renderer = { workspace = true, features = ["capture"] }
sigil-text = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }

[lints]
workspace = true
