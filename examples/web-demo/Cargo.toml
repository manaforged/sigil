[package]
name = "web-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
sigil-ui = { path = "../../crates/sigil", default-features = false, features = ["render"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "PointerEvent",
    "Window",
    "console",
] }
wgpu.workspace = true

[lints]
workspace = true
