<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Sigil component</title>
    <link data-trunk rel="rust" data-wasm-opt="0">
    <style>
      :root {
        --stage-paper: #f7f7f8;
        --stage-muted: #71717a;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body { position: relative; margin: 0; background: var(--stage-paper); }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--stage-muted); font: 13px ui-sans-serif, system-ui, sans-serif; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="sigil-canvas" width="720" height="320" aria-label="Interactive Sigil button demonstration"></canvas>
    <p id="status" role="status">Starting WebGPU…</p>
  </body>
</html>
