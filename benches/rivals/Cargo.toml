[workspace]

[package]
name = "sigil-rivals"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Frame-cost cells for Sigil and rival Rust UI libraries on the same scenes."

[[bin]]
name = "rivals"
path = "src/main.rs"

[dependencies]
sigil-ui = { path = "../../crates/sigil", features = ["terminal"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info", "unstable-backend-writer"] }
egui = "0.37.0"
iced_core = { version = "0.14.0", optional = true }
iced_runtime = { version = "0.14.0", optional = true }
iced_widget = { version = "0.14.0", optional = true }
iced_tiny_skia = { version = "0.14.1", optional = true }
iced_renderer = { version = "0.14.0", optional = true, features = ["tiny-skia"] }
slint = { version = "1.18.1", optional = true, default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
i-slint-core = { version = "=1.18.1", optional = true, default-features = false, features = ["image-decoders", "svg"] }

[build-dependencies]
zerovec = { version = "0.11.9", optional = true, features = ["alloc"] }

[features]
default = []
iced = ["dep:iced_core", "dep:iced_runtime", "dep:iced_widget", "dep:iced_tiny_skia", "dep:iced_renderer"]
slint = ["dep:slint", "dep:i-slint-core", "dep:zerovec"]

[profile.release]
lto = "thin"
codegen-units = 1
